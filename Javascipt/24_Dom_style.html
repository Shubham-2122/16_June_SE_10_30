<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1 id="h1">Hello shubham</h1>

    <button onclick="test()">Chnage style</button>

    <script>

        let h1_tag = document.getElementById("h1")

        function test(){
            h1_tag.innerText = "hello javascript"
            h1_tag.style.background = "red"
            h1_tag.style.color = "white"
            h1_tag.style.fontSize = "50px"
        }

    </script>

</body>
</html>
