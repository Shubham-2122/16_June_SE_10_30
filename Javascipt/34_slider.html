<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 450px;
            width: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    
    <div class="main">
        <img src="/img/1.jpeg" class="demo" height="100%" width="100%" alt="">
        <img src="/img/2.jpeg" class="demo" height="100%" width="100%" alt="">
        <img src="/img/3.jpeg" class="demo" height="100%" width="100%" alt="">
        <img src="/img/4.jpeg" class="demo" height="100%" width="100%" alt="">
    </div>
<!-- 
    <img src="" alt=""> -->

    <button onclick="slider()">></button>

    <script>

        let img_tag = document.getElementsByClassName("demo")

        console.log(img_tag)

        let index = 0

        function slider(){
            
            // hide
            for(let i=0;i<img_tag.length;i++){
                // console.log(i)
                img_tag[i].style.display = "none"
            }
            img_tag[index].style.display = "block"

            index++;

            if(index == 4){
                index = 0
            }

            // setTimeout(slider,1000)

        }

        // slider()
       


    </script>

</body>
</html>
