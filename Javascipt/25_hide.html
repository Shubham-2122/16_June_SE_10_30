<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .demo {
            background: linear-gradient(red, green, blue);
            color: white;
            font-size: 100px;
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>
    <button onclick="test()">Show</button>
    <button onclick="show()">Hide</button>
    <button onclick="data()">Toggle</button>

    <h1 id="h1">Hello javascript</h1>

    <script>
        let h1_tag = document.getElementById("h1")

        function test() {
            h1_tag.classList.add("demo")
        }
        function show() {
            h1_tag.classList.remove("demo")
        }

        function data() {
            h1_tag.classList.toggle("demo")
        }

    </script>

</body>

</html>
