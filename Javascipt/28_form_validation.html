<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="" onsubmit="return validation()">
        <div>
            <input type="text" placeholder="enter your name" id="nm">
            <span id="nmerr"></span>
        </div>
        <div>
            <input type="text" placeholder="enter your surname" id="sm">
            <span id="smerr"></span>
        </div>
        <div>
            <input type="email" placeholder="enter your email" id="em">
            <span id="emerr"></span>
        </div>
        <div>
            <input type="text" placeholder="enter your phone" id="ph">
            <span id="pherr"></span>
        </div>
        <div>
            <input type="password" placeholder="enter your password" id="psw">
            <span id="pswerr"></span>
        </div>
        <div>
            <input type="password" placeholder="enter your cpassword" id="cpsw">
        </div>
        <div>
            <input type="submit">
        </div>
    </form>

    <script>

        let nm_tag = document.getElementById("nm")
        let nmerr = document.getElementById("nmerr")
        let sm_tag = document.getElementById("sm")
        let smerr = document.getElementById("smerr")
        let em_tag = document.getElementById("em")
        let emerr = document.getElementById("emerr")
        let ph_tag = document.getElementById("ph")
        let pherr = document.getElementById("pherr")
        let password_tag = document.getElementById("psw")
        let pswerr = document.getElementById("pswerr")
        let cpassword_tag = document.getElementById("cpsw")


        function validation(){
            if(nm_tag.value == "" || nm_tag.value == null){
                console.log("name required.")
                nmerr.innerHTML = "Name required.."
                nmerr.style.color = "red"
                return false
            }
            else{
                nmerr.innerHTML = ""
                
            }
             if(sm_tag.value == "" || sm_tag.value == null){
                smerr.innerHTML = "Surname required.."
                smerr.style.color = "red"
                return false
            }
            else{
                smerr.innerHTML = ""
                
            }
             if(em_tag.value == "" || em_tag.value == null){
                emerr.innerHTML = "Email required.."
                emerr.style.color = "red"
                return false
            }
            else{
                emerr.innerHTML = ""
                
            }
            if(ph_tag.value == "" || ph_tag.value == null){
                pherr.innerHTML = "phone required.."
                pherr.style.color = "red"
                return false
            }
            else{
                pherr.innerHTML = ""
                
            }
              if(password_tag.value == "" || password_tag.value == null){
                pswerr.innerHTML = "password required.."
                pswerr.style.color = "red"
                return false
            }
            else{
                pswerr.innerHTML = ""
                
            }

            if(password_tag.value != cpassword_tag.value){
                alert("password does not match")
                return false
            }
        }

    </script>

</body>

</html>
