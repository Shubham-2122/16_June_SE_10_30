<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <input type="text" placeholder="Enter your num1" id="num1" value="">
    <input type="text" placeholder="Enter your num2" id="num2">
    <hr>

    <button onclick="sum()">+</button>
    <button onclick="sub()">-</button>
    <button onclick="mul()">*</button>

    <h1 id="test"></h1>


    <script>

        let num1 = document.getElementById("num1")
        console.log(num1)
        let num2 = document.getElementById("num2")
        console.log(num2)

        function sum(){
            let result = parseInt(num1.value) + parseInt(num2.value)
            console.log(result)
            // document.write(result)
            // document.getElementById("test").innerHTML = "Sum : "+result
            document.getElementById("test").innerHTML = `Sum :  ${result}`
        }
         function sub(){
            let result = parseInt(num1.value) - parseInt(num2.value)
            console.log(result)
            // document.write(result)
            // document.getElementById("test").innerHTML = "Sum : "+result
            document.getElementById("test").innerHTML = `Sub :  ${result}`
        }

         function mul(){
            let result = parseInt(num1.value) * parseInt(num2.value)
            console.log(result)
            // document.write(result)
            // document.getElementById("test").innerHTML = "Sum : "+result
            document.getElementById("test").innerHTML = `Mul :  ${result}`
        }

    </script>

</body>
</html>
