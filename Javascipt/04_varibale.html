<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- varibale : to store a value  -->


    <!-- rules : 
    1) do not start with number 
    2) do not start with keyword 
    3) do not start with symboles 
    -->

    <!-- syntax : 

    type variba-name = value  -->


    <script>

        // 1) var : global

        var a = 10 // declration allow
        var a = 13 // re delacration allow
        a = 20  // re-assigement allow
        console.log("a : ",a)
        document.write("A : ",a);

        // 2) let : local scop

        let b = 30 //  // declration allow
        // let b = 35  // re-delacration not allow 
        b =  40 // re-assigement allow
        console.log("b : ",b)


        // 3) const : block , uniqew scope 

        const x = 70  // declration allow
        // const x = 80  // re-delacration not allow  
        // x = 90 // re-assigement not allow 
        console.log("X : ",x)


    </script>


</body>
