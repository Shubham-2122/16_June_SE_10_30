<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        // 1) array inside array 

        let arr = [1,2,3,[4,5,6,[8,9,10]]]

        console.log(arr)
        console.log(arr[1])
        console.log(arr[3][1])
        console.log(arr[3][3][2])

        // 2) object inside object 

        let person = {
            name : "sujal",
            course : {
                front : "front-end",
                back :"back-end"
            },
            age : 24
        }

        console.log(person)
        console.log(person.name)
        console.log(person.course.back)

        // 3) Array inside object 

        let data  = [1,2,3,4,{
            name :"shubham",
            course :"Mern-stack"
        },3,5]

        console.log(data[4].name)


        // 4) object inside array

        let test = {
            name : "harshit",
            course : ["front-end","back-end","full-stack"],
            age : 23
        }
        console.log(test.course[2])

    </script>

</body>
</html>
