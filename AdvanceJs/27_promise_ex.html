<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
  

    <script>

        function outside(res){
            console.log(res)
        }

        let p = new Promise(function(res,err){
            let x = 10 
            if(x == 11){
                res("success data")
            }
            else{
                err("error data")
            }
        })
        .then((test)=>{
            outside(test)
        })
        .catch((demo)=>{
            outside(demo)
        })
        

        console.log(p)

    </script>

</body>
</html>
