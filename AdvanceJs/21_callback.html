<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- callback : one function inside outside call  -->

    <script>

        function demo()
        {
            console.log("hello demo")
        }

        function outside(){
            demo()
        }

        outside()

        setInterval(()=>{
            console.log("hello time")
        },1000)

    </script>

</body>
</html>
