<body>
    
    <script>
        // enc : Hide data 
        // absc : hide data access 
        

        function Person(name,age){
            let _name = name;
            let _age = age;

            this.getName = ()=>{
                return _name
            }
            this.getAge = ()=>{
                return _age
            }

            this.setAge =(newage)=>{
                _age = newage 
                return _age
            }

        }

        const user = new Person("nirav",23)
        console.log(user._name)
        console.log(user._age)
        console.log(user.getName())
         console.log(user.getAge())

         user.setAge(25)
         console.log(user.getAge())



    </script>
