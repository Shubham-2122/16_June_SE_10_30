<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        fetch("data.json",{
            method:"GET"
        })
        .then((res)=>{
            // console.log(res.json())
            return res.json()
        })
        .then((data)=>{
            console.log(data)
            data.forEach((test,index) => {
                console.log(test)
                document.write(`<h3> id :${test.id} name : ${test.name} Age : ${test.age} course : ${test.course}</h3>`)
            });
        })
        .catch((err)=>{
            console.log(err)
        })
    </script>

</body>
</html>
