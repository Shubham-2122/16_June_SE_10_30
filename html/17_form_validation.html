<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- form : register,login,contact,server -->
     <!-- [a-z-A-Z0-9]{} -->

    <form action="" align="center">
        <div>
            <label for="">Enter your name</label>
            <!-- <input type="text" placeholder="Enter your name" pattern="[a-zA-Z]+" title="Name" value="" required> -->
             <input type="text" placeholder="Enter your name" pattern="[a-zA-Z]{3,10}" title="Name" value="" required>
        </div>
        <div>
            <label for="">Enter your surname</label>
            <input type="text" placeholder="Enter your Surname" pattern="[a-zA-Z]{3,10}" required>
        </div>
          <div>
            <label for="">Enter your Phone</label>
            <input type="tel" placeholder="Enter your phone" maxlength="10" pattern="[0-9]{10}" required>
        </div>
        <div>
            <label for="">Enter your Email</label>
            <input type="email" placeholder="Enter your Email" required>
        </div>
        <div>
            <label for="">Enter your Password</label>
            <input type="password" placeholder="Enter your password" required>
        </div>
        <div>
            <input type="submit">
        </div>
    </form>

</body>

</html>
