<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* defualt */
        .main {
            height: 400px;
            /* width: ; */
            background: lightcoral;
        }
         @media only screen and (max-width:1140px) {
            .main {
                background: rgb(201, 125, 58);
            }
        }

        @media only screen and (max-width:992px) {
            .main {
                background: rgb(156, 24, 177);
                width: 500px;
            }
        }

        /* tablets */
        @media only screen and (max-width:768px) {
            .main {
                background: rgb(148, 211, 38);
                width: 100%;
            }
        }

        /* mobile */
        @media only screen and (max-width:576px) {
            .main {
                background: aqua;
                border-radius: 30px;
                height: 200px;
                width: 200px;
            }
        }
    </style>
</head>

<body>
    <div class="main">

    </div>
</body>

</html>
